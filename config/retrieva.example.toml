# Copy to config/retrieva.toml or pass --config / path via RETRIEVA_CONFIG.
# Environment overrides use RETRIEVA_ prefix and __ for nesting, e.g.:
#   RETRIEVA_SERVER__PORT=9090
#   RETRIEVA_LOGGING__LEVEL=debug

data_dir = "./data"

[logging]
level = "info"          # error | warn | info | debug | trace
format = "pretty"       # pretty | json

[server]
host = "0.0.0.0"
port = 8080
grpc_port = 50051
# api_key = "change-me"
rate_limit_rps = 0      # 0 = unlimited

[search]
default_top_k = 10
candidate_pool = 100
fusion = "rrf"          # rrf | weighted
rrf_k = 60
bm25_weight = 0.5
dense_weight = 0.5

[ingest]
chunk_size = 512        # words per chunk
chunk_overlap = 64      # must be < chunk_size

[embedding]
model_path = "models/bge-small-en-v1.5/model.onnx"
model_id = "BAAI/bge-small-en-v1.5"
dimensions = 384
batch_size = 32

[rerank]
# Phase 5 primary is maxsim (hash MaxSim without onnx; ONNX ColBERT if model present).
backend = "maxsim"          # maxsim | cross_encoder | identity
cross_encoder_path = "models/bge-reranker-base/model.onnx"
cross_encoder_id = "BAAI/bge-reranker-base"
maxsim_path = "models/colbert/model.onnx"
top_n = 50
batch_size = 16

[cache]
exact_enabled = true
semantic_enabled = true
exact_capacity = 10000
semantic_threshold = 0.97
ttl_secs = 3600
