[package]
name = "retrieva-ingest"
description = "Document parsing, chunking, and batched embedding for Retrieva"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
# ONNX Runtime embedder (Phase 3). Core/BM25 paths build without this.
# Requires rustc >= 1.92 (ort MSRV).
onnx = ["dep:ort", "dep:tokenizers", "dep:parking_lot"]
# CUDA execution provider (falls back to CPU if EP registration fails).
cuda = ["onnx", "ort/cuda"]

[dependencies]
retrieva-core = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
walkdir = { workspace = true }
unicode-segmentation = { workspace = true }
pdf-extract = { workspace = true }
serde = { workspace = true }
async-trait = { workspace = true }
ort = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
